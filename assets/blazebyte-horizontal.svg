<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="blazeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#9C27B0"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF5722" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(30, 20)">
    <!-- Drawing Tablet -->
    <g transform="translate(0, 10)">
      <!-- Outer Tablet Body -->
      <rect x="0" y="10" width="85" height="100" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="4.5"/>
      <!-- Inner Active Screen Area -->
      <rect x="22" y="18" width="55" height="84" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5"/>
      <!-- Corner crop marks on tablet screen -->
      <path d="M 28 26 L 33 26 M 28 26 L 28 31" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <path d="M 71 26 L 66 26 M 71 26 L 71 31" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <path d="M 28 94 L 33 94 M 28 94 L 28 89" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <path d="M 71 94 L 66 94 M 71 94 L 71 89" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <!-- Tablet Express Keys -->
      <rect x="7" y="24" width="8" height="14" rx="3" fill="#64748B"/>
      <circle cx="11" cy="48" r="4.5" fill="none" stroke="#FF5722" stroke-width="2.5"/>
      <rect x="7" y="62" width="8" height="14" rx="3" fill="#64748B"/>
      <rect x="7" y="82" width="8" height="14" rx="3" fill="#64748B"/>

      <!-- Stylus / Pen -->
      <g transform="translate(15, 102) rotate(-15)">
        <rect x="0" y="0" width="60" height="7" rx="3.5" fill="#1E293B"/>
        <path d="M 60 1.5 L 68 3.5 L 60 5.5 Z" fill="#FF5722"/>
        <line x1="12" y1="0" x2="12" y2="7" stroke="#FFFFFF" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Trail connecting tablet to flight -->
    <path d="M 65 60 C 85 45, 80 15, 96 10" fill="none" stroke="url(#blazeGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 4"/>

    <!-- Paper Airplane taking flight -->
    <g transform="translate(80, -8)" filter="url(#subtleGlow)">
      <!-- Main Left Wing -->
      <polygon points="50,0 0,38 18,22" fill="url(#planeGrad)"/>
      <!-- Bottom fold / Center body -->
      <polygon points="50,0 18,22 25,32" fill="#C2185B"/>
      <!-- Right Wing -->
      <polygon points="50,0 25,32 38,20" fill="#FF5722"/>
      <!-- Outline for extra sharpness -->
      <polygon points="50,0 0,38 25,32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="200" y1="35" x2="200" y2="125" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Typography: BLAZEBYTE STUDIO -->
  <g transform="translate(230, 25)">
    <!-- BLAZEBYTE -->
    <text x="0" y="65" font-family="'Inter', 'Montserrat', 'Helvetica Neue', 'Segoe UI', sans-serif" font-weight="900" font-size="52" letter-spacing="4" fill="#0F172A">
      BLAZE<tspan fill="url(#blazeGrad)">BYTE</tspan>
    </text>
    
    <!-- STUDIO Subtitle with letter spacing -->
    <text x="4" y="98" font-family="'Inter', 'Montserrat', 'Helvetica Neue', 'Segoe UI', sans-serif" font-weight="600" font-size="20" letter-spacing="14" fill="#64748B">
      STUDIO
    </text>

    <!-- Accent Underline -->
    <rect x="4" y="108" width="56" height="3" rx="1.5" fill="url(#blazeGrad)"/>
  </g>
</svg>
