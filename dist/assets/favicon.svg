<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="planeGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="50%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#9C27B0"/>
    </linearGradient>
  </defs>

  <!-- App Icon Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#iconBg)"/>

  <!-- Tablet outline inside icon -->
  <rect x="22" y="32" width="62" height="74" rx="10" fill="#1E293B" stroke="#475569" stroke-width="3"/>
  <rect x="36" y="38" width="42" height="62" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Express buttons -->
  <circle cx="29" cy="46" r="3" fill="#64748B"/>
  <circle cx="29" cy="62" r="3.5" fill="#FF5722"/>
  <circle cx="29" cy="78" r="3" fill="#64748B"/>

  <!-- Flight trail -->
  <path d="M 60 70 C 72 55, 68 35, 80 30" fill="none" stroke="url(#planeGradIcon)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Dynamic Paper Airplane breaking out of the bounds -->
  <g transform="translate(68, 16)">
    <polygon points="44,0 2,34 18,20" fill="url(#planeGradIcon)"/>
    <polygon points="44,0 18,20 24,30" fill="#C2185B"/>
    <polygon points="44,0 24,30 34,18" fill="#FF5722"/>
    <polygon points="44,0 2,34 24,30" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Stylus Pen at bottom -->
  <g transform="translate(32, 108) rotate(-10)">
    <rect x="0" y="0" width="50" height="6" rx="3" fill="#64748B"/>
    <path d="M 50 1 L 56 3 L 50 5 Z" fill="#FF5722"/>
  </g>
</svg>
