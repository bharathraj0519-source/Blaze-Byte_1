<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="blazeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#9C27B0"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g transform="translate(40, 50)">
    <!-- Top & Left Frame Border with Paper Airplane Break -->
    <!-- Top Bar: from x=0 to x=320, breaks before plane at 380 -->
    <path d="M 0 160 L 0 50 L 330 50" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Bottom & Right Frame Border with Tablet Break -->
    <path d="M 420 80 L 420 230 L 290 230" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <path d="M 130 230 L 0 230 L 0 190" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>

    <!-- Paper Airplane at Top-Right Corner -->
    <g transform="translate(325, 10)">
      <!-- Flight ribbon connection knot -->
      <circle cx="28" cy="40" r="4" fill="#E91E63"/>
      <path d="M 28 40 C 20 48, 15 35, 10 38" stroke="url(#planeGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Airplane Wings -->
      <polygon points="90,-5 20,45 42,26" fill="url(#planeGrad)"/>
      <polygon points="90,-5 42,26 52,38" fill="#C2185B"/>
      <polygon points="90,-5 52,38 72,22" fill="#FF5722"/>
      <polygon points="90,-5 20,45 52,38" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- Center Typography -->
    <text x="210" y="152" font-family="'Inter', 'Montserrat', 'Helvetica Neue', 'Segoe UI', sans-serif" font-weight="900" font-size="54" letter-spacing="6" fill="#0F172A" text-anchor="middle">
      BLAZEBYTE
    </text>

    <!-- Subtitle: STUDIO -->
    <text x="210" y="202" font-family="'Inter', 'Montserrat', 'Helvetica Neue', 'Segoe UI', sans-serif" font-weight="700" font-size="20" letter-spacing="12" fill="#64748B" text-anchor="middle">
      STUDIO
    </text>

    <!-- Tablet Cable looping up to the frame break -->
    <path d="M 210 260 C 210 236, 175 230, 150 230" stroke="#0F172A" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Drawing Tablet at Bottom -->
    <g transform="translate(145, 260)">
      <!-- Outer Shell -->
      <rect x="0" y="0" width="130" height="92" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" filter="url(#softShadow)"/>
      
      <!-- Express Keys on Left -->
      <rect x="10" y="16" width="10" height="15" rx="3" fill="#64748B"/>
      <circle cx="15" cy="46" r="5.5" fill="none" stroke="url(#blazeGrad)" stroke-width="3"/>
      <rect x="10" y="62" width="10" height="15" rx="3" fill="#64748B"/>

      <!-- Active Drawing Area -->
      <rect x="28" y="12" width="90" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2.5"/>
      <!-- Subtle Canvas Marks -->
      <path d="M 36 20 L 42 20 M 36 20 L 36 26" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 110 20 L 104 20 M 110 20 L 110 26" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 36 72 L 42 72 M 36 72 L 36 66" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 110 72 L 104 72 M 110 72 L 110 66" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Stylus Pen resting below tablet -->
      <g transform="translate(25, 106) rotate(-8)">
        <rect x="0" y="0" width="80" height="9" rx="4.5" fill="#0F172A"/>
        <path d="M 80 2 L 90 4.5 L 80 7 Z" fill="#FF5722"/>
        <line x1="16" y1="0" x2="16" y2="9" stroke="#FFFFFF" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
